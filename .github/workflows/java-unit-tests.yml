name: Unit Tests (Java)
on:
  push:
    branches:
      - main
    paths:
      - 'custom-payment-flow/server/java/**'
      - '.github/workflows/java-unit-tests.yml'
  pull_request:
    paths:
      - 'custom-payment-flow/server/java/**'
      - '.github/workflows/java-unit-tests.yml'
  workflow_dispatch:

jobs:
  unit_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom-payment-flow/server/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: custom-payment-flow/server/java/pom.xml
      - run: mvn -B test
      - name: Coverage summary
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv
          totals = {}
          for row in csv.DictReader(open('target/site/jacoco/jacoco.csv')):
              for kind in ('LINE', 'BRANCH'):
                  missed, covered = totals.get(kind, (0, 0))
                  totals[kind] = (missed + int(row[kind + '_MISSED']), covered + int(row[kind + '_COVERED']))
          print('### JaCoCo coverage')
          for kind, (missed, covered) in totals.items():
              total = missed + covered
              print(f'- {kind.title()}: {covered}/{total} ({100 * covered / total:.2f}%)')
          EOF
          cat "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: custom-payment-flow/server/java/target/site/jacoco
