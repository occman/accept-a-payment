name: Unit Tests (Node TypeScript)
on:
  push:
    branches:
      - main
    paths:
      - 'custom-payment-flow/server/node-typescript/**'
      - '.github/workflows/node-typescript-unit-tests.yml'
  pull_request:
    paths:
      - 'custom-payment-flow/server/node-typescript/**'
      - '.github/workflows/node-typescript-unit-tests.yml'
  workflow_dispatch:

jobs:
  unit_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom-payment-flow/server/node-typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: custom-payment-flow/server/node-typescript/package-lock.json
      - run: npm ci
      - run: npm test -- --coverage
