name: Unit Tests (Go)
on:
  push:
    branches:
      - main
    paths:
      - 'custom-payment-flow/server/go/**'
      - '.github/workflows/go-unit-tests.yml'
  pull_request:
    paths:
      - 'custom-payment-flow/server/go/**'
      - '.github/workflows/go-unit-tests.yml'
  workflow_dispatch:

jobs:
  unit_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom-payment-flow/server/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: custom-payment-flow/server/go/go.sum
      - run: go vet ./...
      - run: go test -count=1 -coverprofile=coverage.out ./...
      - name: Coverage report
        run: |
          go tool cover -func=coverage.out
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          echo "total statement coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t + 0 >= 75) ? 0 : 1 }' || {
            echo "coverage ${total}% is below the 75% threshold" >&2
            exit 1
          }
