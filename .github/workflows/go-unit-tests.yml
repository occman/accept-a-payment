name: Unit Tests (Go)
on:
  push:
    branches:
      - main
    paths:
      - 'custom-payment-flow/server/go/**'
      - '.github/workflows/go-unit-tests.yml'
  pull_request:
    paths:
      - 'custom-payment-flow/server/go/**'
      - '.github/workflows/go-unit-tests.yml'
  workflow_dispatch:

jobs:
  unit_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom-payment-flow/server/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: custom-payment-flow/server/go/go.mod
          cache-dependency-path: custom-payment-flow/server/go/go.sum
      - run: go vet ./...
      - run: go test -v -cover -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out
