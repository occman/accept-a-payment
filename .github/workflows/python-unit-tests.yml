name: Unit Tests (Python)
on:
  push:
    branches:
      - main
    paths:
      - 'custom-payment-flow/server/python/**'
      - '.github/workflows/python-unit-tests.yml'
  pull_request:
    paths:
      - 'custom-payment-flow/server/python/**'
      - '.github/workflows/python-unit-tests.yml'
  workflow_dispatch:

jobs:
  unit_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom-payment-flow/server/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: custom-payment-flow/server/python/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
