name: Unit Tests (dotnet)
on:
  push:
    branches:
      - main
    paths:
      - 'custom-payment-flow/server/dotnet/**'
      - '.github/workflows/dotnet-unit-tests.yml'
  pull_request:
    paths:
      - 'custom-payment-flow/server/dotnet/**'
      - '.github/workflows/dotnet-unit-tests.yml'
  workflow_dispatch:

jobs:
  unit_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom-payment-flow/server/dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: custom-payment-flow/server/dotnet/global.json
          dotnet-version: 9.0.x
      - run: dotnet test server.sln
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: custom-payment-flow/server/dotnet/tests/server.Tests/TestResults/coverage.cobertura.xml
